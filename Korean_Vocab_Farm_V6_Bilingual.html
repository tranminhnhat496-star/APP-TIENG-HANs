<style>
:root{--bg:#EEF1F7;--sf:#fff;--ink:#0F1B3D;--mute:#5B6785;--line:#D3D9E8;--blue:#1E3FBF;--on:#fff;--ok:#1B7F5A;--bad:#C23A30;--sun:#F4B400;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*,*::before,*::after{box-sizing:border-box}

.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}

.st{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mute)}
.st b{color:var(--ink);font-size:20px;margin-right:4px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--ink);margin-bottom:16px}
.tab{background:none;border:0;padding:9px 16px;font:600 15px 'Be Vietnam Pro',sans-serif;color:var(--mute);cursor:pointer;border-radius:6px 6px 0 0}
.tab.on{background:var(--ink);color:var(--bg)}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}

.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);transition:width .25s}
.card{min-height:280px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;text-align:center;padding:28px 20px;margin-top:10px;background:linear-gradient(color-mix(in srgb,var(--line) 55%,transparent),color-mix(in srgb,var(--line) 55%,transparent)) center/1px 100% no-repeat,linear-gradient(color-mix(in srgb,var(--line) 55%,transparent),color-mix(in srgb,var(--line) 55%,transparent)) center/100% 1px no-repeat,var(--sf);border:2px solid var(--ink);border-radius:6px;box-shadow:6px 6px 0 var(--sun);cursor:pointer}
.card.s{min-height:170px}
.hg{font:700 clamp(48px,14vw,88px)/1.15 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
.vn{font:600 clamp(24px,7vw,36px)/1.25 'Be Vietnam Pro',sans-serif}
.sub{color:var(--blue);font-weight:500}
.ex{font:500 18px/1.5 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--mute);margin-top:6px}
.mute{color:var(--mute);font-size:14px}
.acts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:130px}
.btn{font:600 15px 'Be Vietnam Pro',sans-serif;padding:12px 16px;border-radius:6px;border:2px solid var(--ink);background:var(--sf);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--blue);color:var(--on);border-color:var(--blue)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-width:1.5px;flex:none;min-width:0}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{text-align:left;padding:13px 14px;border:2px solid var(--line);background:var(--sf);color:var(--ink);border-radius:6px;font:500 16px 'Be Vietnam Pro',sans-serif;cursor:pointer}
.opt.k{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:22px}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--sf))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--sf))}
#ti{width:100%;margin-top:16px;font:700 28px 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding:12px}
.add{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.add input,.srch{width:100%}
.row{display:grid;grid-template-columns:minmax(80px,1fr) 2fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rh{font:700 22px 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
.rm span{display:block;font-size:13px;color:var(--mute)}
.pips i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line);margin-right:3px}
.pips i.on{background:var(--ok)}
textarea{width:100%;min-height:170px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace}
.msg{margin-top:10px;font-weight:500}
.rad{display:flex;gap:16px;margin:10px 0;font-size:14px}
input[type=time]{font:inherit;color:var(--ink);background:var(--sf);border:1.5px solid var(--line);border-radius:6px;padding:8px 10px}
.ctl label{display:flex;gap:8px;align-items:center}
a.btn{display:block;text-decoration:none;text-align:center}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
@media(min-width:560px){.mg{grid-template-columns:repeat(4,1fr)}}
.tile{min-height:78px;padding:8px;border:2px solid var(--ink);border-radius:6px;background:var(--sf);color:var(--ink);font:500 16px 'Be Vietnam Pro',sans-serif;cursor:pointer;box-shadow:3px 3px 0 var(--line)}
.tile.k{font:700 22px 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
.tile.on{background:var(--sun);color:#0F1B3D;border-color:var(--sun)}
.tile.ok{background:color-mix(in srgb,var(--ok) 18%,var(--sf));border-color:var(--ok);opacity:.55;box-shadow:none}
.tile.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--sf))}
:root[data-skin=farm]{--bg:#DDEFC4;--sf:#FFF8E1;--ink:#4A2F1B;--mute:#7A5C3E;--line:#E3D3A8;--blue:#2F8F46;--on:#fff;--ok:#2F8F46;--bad:#C0452F;--sun:#F2B134;color-scheme:light}
[data-skin=farm] body{background:linear-gradient(#BFE3F5,#DDEFC4 280px) no-repeat,#DDEFC4}

[data-skin=farm] h1::before{content:'🌾 '}
[data-skin=farm] .tabs{border-bottom:4px solid #8B5E34}
[data-skin=farm] .tab.on{background:#8B5E34;color:#FFF8E1;border-radius:10px 10px 0 0}
[data-skin=farm] .card{border:3px solid #6B4423;border-radius:18px;box-shadow:0 7px 0 #8B5E34}
[data-skin=farm] .btn,[data-skin=farm] .opt,[data-skin=farm] .tile{border-radius:12px;box-shadow:0 3px 0 #6B4423}
[data-skin=farm] .btn.pri{background:#2F8F46;border-color:#1F6B33;box-shadow:0 3px 0 #1F6B33}
[data-skin=farm] .btn.ok{box-shadow:0 3px 0 #1F6B33}
[data-skin=farm] .tile.on{background:#F2B134;color:#4A2F1B;border-color:#8B5E34}
[data-skin=farm] select,[data-skin=farm] input[type=text],[data-skin=farm] input[type=time],[data-skin=farm] textarea{border-radius:10px;border-color:#C9B27C}
[data-skin=farm] .bar{background:#E3D3A8;height:10px;border-radius:5px}
[data-skin=farm] .bar i{background:linear-gradient(90deg,#7BC043,#2F8F46)}
#farm{display:none}
[data-skin=farm] #farm{display:block}
.fm{background:repeating-linear-gradient(#8B5E34 0 18px,#7C5129 18px 20px);border:3px solid #6B4423;border-radius:14px;padding:10px;margin-bottom:16px}
.fm .mute{color:#FFF8E1;margin-bottom:6px}
.pl{display:inline-flex;width:34px;height:34px;align-items:center;justify-content:center;font-size:20px;background:#6B4423;border-radius:8px;margin:2px}
@keyframes pop{0%{transform:scale(.3);filter:brightness(1.6)}60%{transform:scale(1.5)}100%{transform:scale(1)}}
.pp{position:fixed;left:50%;top:34%;z-index:60;transform:translateX(-50%);font:700 22px 'Be Vietnam Pro',sans-serif;color:var(--sun);text-shadow:0 2px 0 rgba(0,0,0,.35);pointer-events:none;animation:fl 1s ease-out forwards}
.pp.big{top:22%;font-size:26px;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;text-shadow:none}
@keyframes fl{to{transform:translate(-50%,-70px);opacity:0}}
.sh{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

.pl.sick{cursor:pointer;outline:2px dashed #FFF8E1;outline-offset:-3px}
.pl.pop{animation:pop .7s ease-out}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.yard{margin-top:8px;padding-top:8px;border-top:2px dashed #C9B27C;font-size:28px;line-height:1.3}
.yard span{display:inline-block;margin:0 5px}
.yard .pet{animation:bob 1.6s ease-in-out infinite}
.yard span:nth-child(2n){animation-delay:.5s}
.shop{display:grid;gap:10px}
.it{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--sf);border:2px solid var(--line);border-radius:12px}
.it .em{font-size:34px}
.it div:nth-child(2){flex:1}
.btn:disabled{opacity:.5;cursor:not-allowed}
.dq{background:var(--sf);border:2px solid var(--ink);border-radius:6px;padding:12px 14px;margin-bottom:16px}
.dqt{font-weight:600;margin:2px 0 8px}
[data-skin=farm] .dq{border-radius:14px;border-color:#6B4423}
.hit{display:inline-block;animation:pop .5s}
.tabs{overflow-x:auto}
.tab{white-space:nowrap}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const IV0=[0,6e5,864e5,2592e5,6048e5,12096e5],IV=new Proxy(IV0,{get:(t,k)=>typeof k=='string'&&/^\d+$/.test(k)&&has(3)?t[k]*1.5:t[k]});
const HDR=/^(한글|hangul|han|korean|tiếng hàn|từ vựng|từ)$/i;

function pick(o,keys){for(const k of keys.split(' '))for(const kk in o)if(kk.toLowerCase()==k)return o[kk];return''}
function parseTable(t){
  t=t.replace(/^\uFEFF/,'').trim();if(!t)return[];
  if(t[0]=='['||t[0]=='{'){try{let j=JSON.parse(t);if(!Array.isArray(j))j=j.cards||j.words||[j];
    return j.map(o=>Array.isArray(o)?o:[pick(o,'h han hangul korean ko'),pick(o,'m nghia meaning vi'),pick(o,'p pronunciation romanization'),pick(o,'e example vd'),pick(o,'g group nhom'),o.box,o.due,pick(o,'bo deck dn')])}catch(e){}}
  const first=t.split(/\r?\n/)[0];
  const d=['\t',',',';','|'].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;
    else if(ch==d){r.push(c);c=''}
    else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);rows.push(r);r=[];c=''}
    else c+=ch}
  r.push(c);rows.push(r);return rows}
function toCards(rows){
  return rows.map(r=>r.map(x=>typeof x=='string'?x.trim():x)).filter((r,i)=>r[0]&&r[1]&&!(i==0&&HDR.test(String(r[0]))))
    .map(r=>({id:uid(),dn:String(r[7]||''),h:String(r[0]),m:String(r[1]),p:r[2]||'',e:r[3]||'',g:r[4]||'',box:+r[5]||0,due:+r[6]||0}))}

let view='study',Q=[],cur=null,flipped=false,done=0,answered=null,wrong=false,optIds=[];

function startSession(){
  const now=Date.now(),o=S.opt;
  Q=shuffle(CS().filter(c=>(!o.group||c.g==o.group)&&(!o.due||c.due<=now)&&(o.mode!='order'||ordOk(c))).map(c=>c.id));

function next(){
  cur=Q.length?S.cards.find(c=>c.id==Q[0]):null;flipped=false;answered=null;wrong=false;
  if(cur&&['quiz','listen'].includes(S.opt.mode))optIds=mkOpts(cur)}
function mkOpts(c){
  const kv=S.opt.mode=='listen'||S.opt.dir=='kv'||(S.opt.mode=='boss'&&BS&&BS.e=='👺'),f=x=>kv?x.m:x.h,seen=new Set([f(c)]),d=[];
  for(const x of shuffle((CS().length>3?CS():S.cards).filter(x=>x.id!=c.id))){if(!seen.has(f(x))){seen.add(f(x));d.push(x)}if(d.length==3)break}
  return shuffle([c,...d]).map(x=>x.id)}
function mark(ok){sfx(ok?'ok':'bad');gain((ok?5:1)*(S.opt.mode=='type'&&has(0)?2:1));if(ok){GROW.add(cur.id);dqAdd('ok',1)}cur.box=ok?Math.min(5,cur.box+1):0;cur.due=Date.now()+IV[cur.box];res(cur,ok);wrong=!ok;if(ok)done++;save()}

  if(o.mode=='listen')return gListen(el);if(o.mode=='sent')return gSent(el);if(o.mode=='order')return gOrder(el);const c=cur,m=o.mode,kv=m!='type'&&o.dir=='kv';
  const extra=(c.p?`<div class="sub">${esc(c.p)}</div>`:'')+(c.e?`<div class="ex">${esc(c.e)}</div>`:'');

  if(m=='card'){

function def(o,k,v){if(o[k]===undefined)o[k]=v;return o[k]}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var V=S.v7||{};
def(V,'decor',{own:{},placed:[],bonus:{}});
var D=V.decor;
if(!D.own)D.own={}; if(!D.placed)D.placed=[]; if(!D.bonus)D.bonus={};

var CAT={nature:'Thiên nhiên',buildings:'Công trình',seasonal:'Theo mùa',special:'Đặc biệt'};
var RAR={common:'Phổ biến',rare:'Hiếm',epic:'Sử thi',mythic:'Huyền thoại'};
var SEA={spring:'Xuân',summer:'Hạ',autumn:'Thu',winter:'Đông',special:'Đặc biệt',all:'Quanh năm'};
/* id, name, price {xp|gem}, category, rarity, season, size, effect, desc */
var DECOR=[
 {id:'ancient_tree',n:'Cây Cổ Thụ',p:{xp:150},cat:'nature',r:'rare',s:'all',w:'big',fx:'sway',d:'Cây cổ thụ tỏa bóng mát cho cả nông trại.'},
 {id:'pumpkin',n:'Bí Ngô Vàng',p:{xp:120},cat:'seasonal',r:'common',s:'autumn',w:'med',fx:'glow',d:'Bí ngô mùa thu, phát sáng dịu vào buổi tối.'},
 {id:'farmhouse',n:'Nhà Nông Ấm Cúng',p:{xp:250},cat:'buildings',r:'epic',s:'all',w:'big',fx:'smoke',d:'Ngôi nhà nhỏ với ống khói luôn tỏa khói ấm.'},
 {id:'tractor',n:'Máy Kéo Đỏ',p:{xp:300},cat:'buildings',r:'epic',s:'all',w:'med',fx:'engine',d:'Máy kéo đỏ mạnh mẽ. Bấm vào để khởi động!'},
 {id:'cherry_blossom',n:'Hoa Anh Đào',p:{gem:5},cat:'seasonal',r:'epic',s:'spring',w:'big',fx:'petals',d:'Cây anh đào nở rộ, cánh hoa rơi bay.'},
 {id:'watermelon_garden',n:'Vườn Dưa Hấu',p:{xp:180},cat:'seasonal',r:'rare',s:'summer',w:'med',fx:'sway',d:'Dưa hấu ngọt lịm dưới nắng hè.'},
 {id:'wind_chime',n:'Chuông Gió',p:{gem:4},cat:'special',r:'rare',s:'special',w:'small',fx:'swing',d:'Chuông gió leng keng theo từng cơn gió.'},
 {id:'autumn_tree',n:'Cây Phong Đỏ',p:{xp:150},cat:'seasonal',r:'rare',s:'autumn',w:'big',fx:'leaves',d:'Lá phong đỏ rực, lá vàng rơi theo gió.'},
 {id:'snowman',n:'Người Tuyết',p:{xp:200},cat:'seasonal',r:'epic',s:'winter',w:'med',fx:'snow',d:'Người tuyết đội mũ đỏ, tuyết rơi nhẹ quanh.'},
 {id:'butterflies',n:'Đàn Bướm',p:{gem:6},cat:'nature',r:'epic',s:'spring',w:'small',fx:'fly',d:'Ba chú bướm bay lượn quanh nông trại.'},
 {id:'roasted_sweet_potato',n:'Khoai Lang Nướng',p:{xp:100},cat:'seasonal',r:'common',s:'autumn',w:'med',fx:'steam',d:'Giỏ khoai lang nướng bốc khói thơm phức.'},
 {id:'moon_lantern',n:'Đèn Trăng',p:{gem:8},cat:'special',r:'mythic',s:'special',w:'med',fx:'nightglow',d:'Đèn lồng trăng phát sáng rực rỡ vào ban đêm.'}
];
var byId={}; DECOR.forEach(function(x){byId[x.id]=x});
function curSeason(){try{return season()}catch(e){return 2}}
var SEASON_KEYS=['spring','summer','autumn','winter'];
function ownCount(id){return D.own[id]||0}
function placedCount(id){return D.placed.filter(function(p){return p.id===id}).length}
function priceHtml(p){
  if(p.xp)return '<img src="assets/icons/v6/coin.png" alt=""> '+p.xp+' XP';
  return '<img src="assets/icons/v6/gem.png" alt=""> '+p.gem+' 💎';
}
function canAfford(it){
  if(it.p.xp)return coins()>=it.p.xp;
  return (V.gems||0)>=it.p.gem;
}
function save10(){try{save()}catch(e){} try{stats()}catch(e){} updateHud10()}
function updateHud10(){
  try{
    var h=$('#v7hud'); if(!h)return;
    var gem=h.querySelector('.chip.gem b'); if(gem)gem.textContent=V.gems||0;
    $$('.chip',h).forEach(function(c){if(/XP/.test(c.textContent)&&!c.classList.contains('gem')){var b=c.querySelector('b'); if(b)b.textContent=coins()}});
  }catch(e){}
}
function toast10(t,ms){
  var d=document.createElement('div');d.className='v10toast';d.textContent=t;
  document.body.appendChild(d);setTimeout(function(){d.remove()},ms||2600);
}
/* ---------- modal: shop + inventory ---------- */
var ST={tab:'shop',cat:'all',rar:'all',sea:'all'};
function ownedTotal(){return DECOR.filter(function(x){return ownCount(x.id)>0}).length}
function shopHtml(){
  var cs=curSeason(), curKey=SEASON_KEYS[cs];
  var list=DECOR.filter(function(x){
    if(ST.cat!=='all'&&x.cat!==ST.cat)return false;
    if(ST.rar!=='all'&&x.r!==ST.rar)return false;
    if(ST.sea!=='all'&&x.s!==ST.sea)return false;
    return true;
  });
  var cards=list.map(function(x){
    var inSeason=x.s===curKey, own=ownCount(x.id), afford=canAfford(x);
    return '<div class="v10card'+(inSeason?' inseason':'')+'">'
      +'<img class="v10thumb" src="assets/decor/'+x.id+'.png" alt="'+esc(x.n)+'" loading="lazy">'
      +'<b>'+esc(x.n)+'</b>'
      +'<div class="v10badges"><span class="v10badge '+x.r+'">'+RAR[x.r]+'</span><span class="v10badge cat">'+CAT[x.cat]+'</span><span class="v10badge season">'+SEA[x.s]+'</span>'+(inSeason?'<span class="v10badge inseason">Đang vào mùa</span>':'')+'</div>'
      +'<div class="d">'+esc(x.d)+'</div>'
      +'<div class="v10price">'+priceHtml(x.p)+'</div>'
      +(own>0?'<div class="v10own">Đã sở hữu: '+own+'</div>':'')
      +'<button class="btn sm '+(afford?'pri':'')+'" '+(afford?'':'disabled')+' onclick="v10Buy(\''+x.id+'\')">'+(afford?'Mua':'Không đủ')+'</button> '
      +'<button class="btn sm" onclick="v10Preview(\''+x.id+'\')">Xem trước</button>'
      +'</div>';
  }).join('');
  return '<div class="v10filters">'
    +['all','nature','buildings','seasonal','special'].map(function(c){return '<button class="v10fchip'+(ST.cat===c?' on':'')+'" onclick="v10Filter(\'cat\',\''+c+'\')">'+(c==='all'?'Tất cả':CAT[c])+'</button>'}).join('')
    +'<select onchange="v10Filter(\'rar\',this.value)" aria-label="Độ hiếm">'+['all','common','rare','epic','mythic'].map(function(r){return '<option value="'+r+'"'+(ST.rar===r?' selected':'')+'>'+(r==='all'?'Mọi độ hiếm':RAR[r])+'</option>'}).join('')+'</select>'
    +['all','spring','summer','autumn','winter','special'].map(function(s){return '<button class="v10fchip'+(ST.sea===s?' on':'')+'" onclick="v10Filter(\'sea\',\''+s+'\')">'+(s==='all'?'Mọi mùa':SEA[s])+'</button>'}).join('')
    +'</div>'
    +'<p class="mute">Mùa hiện tại: '+SN[cs]+'. Đồ theo mùa đặt đúng mùa được thưởng +10 XP (mỗi món một lần mỗi mùa).</p>'
    +'<div class="v10grid">'+(cards||'<p class="mute">Không có vật phẩm nào khớp bộ lọc.</p>')+'</div>';
}
function invHtml(){
  var owned=DECOR.filter(function(x){return ownCount(x.id)>0});
  var rows=owned.map(function(x){
    return '<div class="v10invrow"><img src="assets/decor/'+x.id+'.png" alt="">'
      +'<div class="grow"><b>'+esc(x.n)+'</b><div class="mute">'+CAT[x.cat]+' · '+RAR[x.r]+' · '+SEA[x.s]+'</div></div>'
      +'<span class="v10own">x'+ownCount(x.id)+'</span>'
      +'<button class="btn sm pri" onclick="v10PlaceStart(\''+x.id+'\')">Đặt lên nông trại</button></div>';
  }).join('')||'<p class="mute">Kho trống — hãy mua vật phẩm ở tab Cửa hàng.</p>';
  var placed=D.placed.map(function(p,i){
    var x=byId[p.id];
    return '<div class="v10invrow"><img src="assets/decor/'+p.id+'.png" alt="">'
      +'<div class="grow"><b>'+esc(x.n)+'</b><div class="mute">Vị trí '+Math.round(p.x)+'%, '+Math.round(p.y)+'%'+(p.rot?' · xoay '+p.rot+'°':'')+'</div></div>'
      +'<button class="btn sm" onclick="v10PlaceStart(null,'+i+')">Di chuyển</button>'
      +'<button class="btn sm" onclick="v10Recall('+i+')">Thu hồi</button></div>';
  }).join('')||'<p class="mute">Chưa đặt vật phẩm nào lên nông trại.</p>';
  return '<h3>Kho của bạn</h3>'+rows+'<h3>Đã đặt trên nông trại ('+D.placed.length+')</h3>'+placed;
}
function modalHtml(){
  return '<h2><img src="assets/icons/v6/farm.png" style="width:30px;height:30px;vertical-align:-.25em"> Cửa hàng Trang trí</h2>'
    +'<p class="mute">Đã sở hữu '+ownedTotal()+'/12 món · Đã đặt '+D.placed.length+' món trên nông trại.</p>'
    +'<div class="v10wallet"><span class="chip"><img src="assets/icons/v6/coin.png" alt=""> <b>'+coins()+'</b> XP</span><span class="chip"><img src="assets/icons/v6/gem.png" alt=""> <b>'+(V.gems||0)+'</b> 💎</span></div>'
    +'<div class="v10tabs"><button class="v10tab'+(ST.tab==='shop'?' on':'')+'" onclick="v10Tab(\'shop\')">Cửa hàng</button><button class="v10tab'+(ST.tab==='inv'?' on':'')+'" onclick="v10Tab(\'inv\')">Kho đồ ('+DECOR.reduce(function(a,x){return a+ownCount(x.id)},0)+' trong kho · '+D.placed.length+' đã đặt)</button></div>'
    +'<div id="v10body">'+(ST.tab==='shop'?shopHtml():invHtml())+'</div>'
    +'<div class="v10acts"><button class="btn pri" onclick="v10Close()">Đóng</button></div>';
}
function renderModal(){
  var m=$('#v10modal'); if(!m)return;
  var box=m.querySelector('.v10box'); if(!box)return;
  box.innerHTML=modalHtml();
}
window.v10Open=function(tab){
  if(tab)ST.tab=tab;
  var old=$('#v10modal'); if(old)old.remove();
  var d=document.createElement('div');d.className='v10modal';d.id='v10modal';
  d.innerHTML='<div class="v10box">'+modalHtml()+'</div>';
  d.addEventListener('click',function(e){if(e.target===d)v10Close()});
  document.body.appendChild(d);
};
window.v10Close=function(){var m=$('#v10modal');if(m)m.remove();updateHud10()};
window.v10Tab=function(t){ST.tab=t;renderModal()};
window.v10Filter=function(k,v){ST[k]=v;renderModal()};
var FXLABEL={sway:'Lá đung đưa theo gió',glow:'Phát sáng dịu',smoke:'Khói ống khói bay lên',engine:'Bấm vào để khởi động máy',petals:'Cánh hoa rơi bay',swing:'Rung nhẹ theo gió',leaves:'Lá vàng rơi theo gió',snow:'Tuyết rơi nhẹ quanh món',fly:'Bay lượn quanh chỗ đặt',steam:'Khói bốc lên',nightglow:'Phát sáng mạnh vào ban đêm'};
window.v10Preview=function(id){
  var x=byId[id]; if(!x)return;
  var own=ownCount(id), afford=canAfford(x);
  var old=$('#v10preview'); if(old)old.remove();
  var d=document.createElement('div');d.className='v10modal';d.id='v10preview';
  d.innerHTML='<div class="v10box v11preview"><h2>'+esc(x.n)+'</h2>'
    +'<img src="assets/decor/'+x.id+'.png" alt="'+esc(x.n)+'">'
    +'<div class="v10badges"><span class="v10badge '+x.r+'">'+RAR[x.r]+'</span><span class="v10badge cat">'+CAT[x.cat]+'</span><span class="v10badge season">'+SEA[x.s]+'</span></div>'
    +'<p>'+esc(x.d)+'</p>'
    +'<p class="mute">Hiệu ứng: '+FXLABEL[x.fx]+'. Đặt lên nông trại: kéo thả, xoay 45°, thu hồi về kho.</p>'
    +'<div class="v10price">'+priceHtml(x.p)+'</div>'
    +(own>0?'<div class="v10own">Đã sở hữu: '+own+'</div>':'')
    +'<div class="v10acts">'
    +(own>0?'<button class="btn pri" onclick="v10ClosePreview();v10Open(\'inv\')">Mở kho đồ</button>'
           :'<button class="btn pri" '+(afford?'':'disabled')+' onclick="v10BuyFromPreview(\''+x.id+'\')">'+(afford?'Mua':'Không đủ')+'</button>')
    +'<button class="btn" onclick="v10ClosePreview()">Đóng</button></div></div>';
  d.addEventListener('click',function(e){if(e.target===d)v10ClosePreview()});
  document.body.appendChild(d);
};
window.v10ClosePreview=function(){var m=$('#v10preview');if(m)m.remove()};
window.v10BuyFromPreview=function(id){if(window.v10Buy(id)){v10ClosePreview();v10Open('shop')}};
window.v10Buy=function(id){
  var x=byId[id]; if(!x)return false;
  if(!canAfford(x)){toast10('Chưa đủ '+(x.p.xp?'XP':'💎')+' để mua '+x.n);return false}
  if(x.p.xp){S.spent=(S.spent||0)+x.p.xp}else{V.gems=(V.gems||0)-x.p.gem}
  D.own[id]=ownCount(id)+1;
  save10(); renderModal();
  try{sfx('win')}catch(e){}
  try{pop('Đã mua '+x.n+'!',1)}catch(e){}
  toast10('Đã mua '+x.n+' — vào tab Kho đồ để đặt lên nông trại');
  return true;
};
/* ---------- placement ---------- */
var GH=null; /* {id,x,y,rot,idx} idx=-1 new from inventory, >=0 moving placed */
function sceneEl(){var sc=$('#farm .scene');return sc||null}
function layerEl(){
  var sc=sceneEl(); if(!sc)return null;
  var l=sc.querySelector('.v10layer');
  if(!l){l=document.createElement('div');l.className='v10layer';sc.appendChild(l)}
  return l;
}
function fxSpans(x){
  if(x.fx==='smoke')return '<span class="v10pt s1"></span><span class="v10pt s2"></span>';
  if(x.fx==='steam')return '<span class="v10pt st1"></span><span class="v10pt st2"></span>';
  if(x.fx==='petals')return '<span class="v10pt p1"></span><span class="v10pt p2"></span><span class="v10pt p3"></span>';
  if(x.fx==='leaves')return '<span class="v10pt l1"></span><span class="v10pt l2"></span><span class="v10pt l3"></span>';
  if(x.fx==='snow')return '<span class="v10pt w1"></span><span class="v10pt w2"></span><span class="v10pt w3"></span>';
  return '';
}
function placedEl(p,i){
  var x=byId[p.id]; if(!x)return null;
  var d=document.createElement('div');
  d.className='v10placed w-'+x.w; d.dataset.idx=i;
  d.style.left=p.x+'%'; d.style.top=p.y+'%';
  d.style.transform='translate(-50%,-92%) rotate('+(p.rot||0)+'deg)';
  d.innerHTML='<img class="v10fx-'+x.fx+'" src="assets/decor/'+x.id+'.png" alt="'+esc(x.n)+'" draggable="false">'+fxSpans(x);
  d.addEventListener('click',function(e){e.stopPropagation();selectPlaced(i,e.clientX,e.clientY)});
  return d;
}
var lastSig='';
function renderPlaced(){
  var l=layerEl(); if(!l)return;
  ensureFarmBtn();
  var sig=JSON.stringify(D.placed)+'|'+(GH?JSON.stringify(GH):'');
  if(sig===lastSig&&l.querySelectorAll('.v10placed').length===D.placed.length)return;
  lastSig=sig;
  l.innerHTML='';
  D.placed.forEach(function(p,i){var el=placedEl(p,i); if(el)l.appendChild(el)});
  if(GH){
    var x=byId[GH.id];
    var g=document.createElement('div');
    g.className='v10ghost w-'+x.w; g.id='v10ghost';
    g.style.left=GH.x+'%'; g.style.top=GH.y+'%';
    g.style.transform='translate(-50%,-92%) rotate('+(GH.rot||0)+'deg)';
    g.innerHTML='<img src="assets/decor/'+GH.id+'.png" alt="" draggable="false">';
    l.appendChild(g);
    bindGhostDrag(g);
  }
  ensureFarmBtn();
}
function ensureFarmBtn(){
  var fm=$('#farm .fm'); if(!fm)return;
  if(fm.querySelector('#v10farmbtn'))return;
  var b=document.createElement('button');
  b.className='btn sm'; b.id='v10farmbtn'; b.style.cssText='display:block;margin:8px 0';
  b.textContent='Trang trí nông trại';
  b.addEventListener('click',function(){v10Open('inv')});
  var yard=fm.querySelector('.yard');
  if(yard)yard.after(b); else fm.appendChild(b);
}
/* placement zone = front grass strip of the scene, so items sit on the
   ground in front of the hero farm picture instead of on its buildings */
function clampPos(x,y){
  return {x:Math.max(3,Math.min(97,x)), y:Math.max(78,Math.min(95,y))};
}
function pointToPct(e){
  var sc=sceneEl(); if(!sc)return null;
  var r=sc.getBoundingClientRect();
  return clampPos((e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100);
}
function bindGhostDrag(g){
  var dragging=false;
  g.addEventListener('pointerdown',function(e){
    dragging=true; g.setPointerCapture(e.pointerId); e.preventDefault();
  });
  g.addEventListener('pointermove',function(e){
    if(!dragging||!GH)return;
    var p=pointToPct(e); if(!p)return;
    GH.x=p.x; GH.y=p.y;
    g.style.left=p.x+'%'; g.style.top=p.y+'%';
  });
  g.addEventListener('pointerup',function(){dragging=false});
  g.addEventListener('pointercancel',function(){dragging=false});
}
function showBar(){
  hideBar();
  var x=byId[GH.id];
  var bar=document.createElement('div');bar.className='v10bar';bar.id='v10bar';
  bar.innerHTML='<span class="nm">'+esc(x.n)+'</span><span class="mute" style="color:#CFE8C9">Kéo để di chuyển · bấm vào cảnh để đặt</span>'
    +'<button class="rot" onclick="v10RotateGhost()">Xoay</button>'
    +'<button class="ok" onclick="v10PlaceConfirm()">Xác nhận</button>'
    +'<button class="cancel" onclick="v10PlaceCancel()">Hủy</button>';
  document.body.appendChild(bar);
}
function hideBar(){var b=$('#v10bar');if(b)b.remove()}
window.v10PlaceStart=function(id,idx){
  if(!S.skin||S.skin!=='farm'){toast10('Bật Giao diện nông trại để đặt đồ trang trí (nút ở đầu trang)');return false}
  if(!sceneEl()){
    /* farm() rebuilds #farm and V3 garden() re-creates .scene async;
       retry shortly instead of failing */
    try{farm()}catch(e){}
    setTimeout(function(){window.v10PlaceStart(id,idx)},350);
    toast10('Đang chuẩn bị nông trại…');
    return true;
  }
  v10Close();
  if(idx==null||idx===undefined){
    if(!id||ownCount(id)<=0){toast10('Bạn chưa có vật phẩm này trong kho');return false}
    GH={id:id,x:50,y:86,rot:0,idx:-1};
  }else{
    var p=D.placed[idx]; if(!p)return false;
    GH={id:p.id,x:p.x,y:p.y,rot:p.rot||0,idx:idx};
  }
  lastSig=''; renderPlaced(); showBar();
  var sc=sceneEl();
  sc.addEventListener('pointerdown',sceneTap);
  toast10('Đang đặt '+byId[GH.id].n+' — kéo để di chuyển, bấm Xác nhận khi ưng ý');
  return true;
};
function sceneTap(e){
  if(!GH)return;
  if(e.target.closest&&e.target.closest('.v10placed'))return;
  var p=pointToPct(e); if(!p)return;
  GH.x=p.x; GH.y=p.y;
  var g=$('#v10ghost');
  if(g){g.style.left=p.x+'%';g.style.top=p.y+'%'}
}
window.v10RotateGhost=function(){
  if(!GH)return; GH.rot=(GH.rot+45)%360;
  var g=$('#v10ghost'); if(g)g.style.transform='translate(-50%,-92%) rotate('+GH.rot+'deg)';
};
function overlaps(x,y,id){
  for(var i=0;i<D.placed.length;i++){
    if(GH&&GH.idx===i)continue;
    var p=D.placed[i];
    var lim=(id==='butterflies'||p.id==='butterflies')?{dx:5,dy:4}:{dx:9,dy:6};
    if(Math.abs(p.x-x)<lim.dx&&Math.abs(p.y-y)<lim.dy)return true;
  }
  return false;
}
window.v10PlaceAt=function(x,y){if(!GH)return false;var p=clampPos(x,y);GH.x=p.x;GH.y=p.y;lastSig='';renderPlaced();return true};
window.v10PlaceConfirm=function(){
  if(!GH)return false;
  if(overlaps(GH.x,GH.y,GH.id)){
    toast10('Vị trí bị chồng lấn — kéo ra chỗ khác nhé');
    var g=$('#v10ghost'); if(g){g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake')}
    return false;
  }
  var x=byId[GH.id], isNew=GH.idx===-1;
  if(isNew){D.own[GH.id]=ownCount(GH.id)-1;D.placed.push({id:GH.id,x:GH.x,y:GH.y,rot:GH.rot})}
  else{D.placed[GH.idx]={id:GH.id,x:GH.x,y:GH.y,rot:GH.rot}}
  /* season bonus: +10 XP once per item per season, in-season only */
  if(isNew&&x.s!=='all'&&x.s!=='special'&&x.s===SEASON_KEYS[curSeason()]){
    var key=x.id+'|'+new Date().getFullYear()+'-'+curSeason();

};

/* Grandfathered region chests: grant once for regions already complete
   before this layer existed. */
setTimeout(function(){
  var granted=[];
  for(var r=0;r<REGIONS.length;r++){

    }
  }
  if(granted.length) toast13('Rương vùng đã hoàn thành trước đây: '+granted.join(' · '));
},1500);
})();

/* ---- state ---- */
function enState(){
  S.v7=S.v7||{};
  var e=S.v7.en;
  if(!e){
    e=S.v7.en={box:{},right:{},wrong:{},review:[],done:{},custom:[],dir:'ev',ex:'choice',topic:'',
      streak:0,lastDay:'',xpAt:{},stats:{ev:{r:0,w:0},ve:{r:0,w:0}}};
  }
  e.stats=e.stats||{ev:{r:0,w:0},ve:{r:0,w:0}};
  e.xpAt=e.xpAt||{};
  return e;
}
function norm(s){ return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim(); }
function esc14(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function allWords(){
  var list=ENWORDS.map(function(w,i){ return {id:'w'+i,t:w[0],en:w[1],vi:w[2],ipa:w[3],pos:w[4],ex:w[5],exvi:w[6],custom:false}; });
  var e=enState();
  (e.custom||[]).forEach(function(w,i){ list.push({id:w.uid||('c'+i),t:w.t,en:w.en,vi:w.vi,ipa:w.ipa||'',pos:w.pos||'n',ex:w.ex||'',exvi:w.exvi||'',custom:true}); });
  return list;
}
function wordById(id){
  var list=allWords();
  for(var i=0;i<list.length;i++) if(list[i].id===id) return list[i];
  return null;
}
function topicOf(id){ for(var i=0;i<TOPICS.length;i++) if(TOPICS[i].id===id) return TOPICS[i]; return null; }
function topicWords(tid){ return allWords().filter(function(w){ return w.t===tid; }); }
function shuffle14(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* ---- session (in-memory only) ---- */
var EN={cur:null, answered:null, ok:null, fcIdx:0, fcFlip:false, fcList:null,
  mPairs:null, mSel:null, mDone:0, scTiles:null, scBuilt:'', race:null,
  sessRight:0, sessXp:0, lastId:null, reviewMode:false};

/* ---- picking ---- */
function poolWords(){
  var e=enState(), list=allWords();
  if(e.topic) list=list.filter(function(w){ return w.t===e.topic; });
  if(EN.reviewMode) list=list.filter(function(w){ return (e.wrong[w.id]||0)>0 || (e.review||[]).indexOf(w.id)>=0; });
  return list;
}
function pickWord(){
  if(EN.forceId){ var fw=wordById(EN.forceId); EN.forceId=null; if(fw) return fw; }
  var list=poolWords();
  if(!list.length) list=allWords();
  if(!list.length) return null;
  var e=enState();
  // priority: wrong words first, then low boxes, then new words
  var score=function(w){
    var wr=e.wrong[w.id]||0, bx=e.box[w.id]||0;
    return wr*10 + (5-bx)*2 + ((e.right[w.id]||0)===0?1:0);
  };
  list=list.slice().sort(function(a,b){ return score(b)-score(a)+ (Math.random()-0.5)*3; });
  var w=list[0];
  if(w.id===EN.lastId && list.length>1) w=list[1];
  EN.lastId=w.id;
  return w;
}
function distractors(w, n, field){
  var pool=allWords().filter(function(x){ return x.id!==w.id && x[field]!==w[field]; });
  return shuffle14(pool).slice(0,n);
}
function setupQuestion(){
  var e=enState(), kind=e.ex;
  if(kind==='card'||kind==='topics'||kind==='vocab'||kind==='review'){ EN.cur=null; EN.answered=null; return; }
  if(kind==='race'){ startRace(); return; }
  var w=pickWord();
  if(!w){ EN.cur=null; return; }
  var q={w:w, kind:kind, opts:null, tiles:null};
  if(kind==='choice'||kind==='listen'){
    var field=e.dir==='ev'?'vi':'en';
    if(kind==='listen'&&e.dir==='ve') field='en';
    q.opts=shuffle14([w].concat(distractors(w,3,field)));
  }
  if(kind==='fill'){
    q.opts=shuffle14([w].concat(distractors(w,3,'en')));
    q.sent=w.ex.replace(new RegExp('\\b'+w.en.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i'),'_____');
    if(q.sent===w.ex) q.sent='_____ '+w.ex;
  }
  if(kind==='scramble'){
    q.tiles=shuffle14(w.en.replace(/[^a-z]/gi,'').toLowerCase().split(''));
    EN.scBuilt=''; EN.scUsed={};
  }
  if(kind==='match'){
    var ws=shuffle14(poolWords()).slice(0,4);
    if(ws.length<2) ws=shuffle14(allWords()).slice(0,4);
    q.match=ws;
    EN.mPairs={}; EN.mSel=null; EN.mDone=0;
  }
  EN.cur=q; EN.answered=null; EN.ok=null;
}

/* ---- marking (anti-farm XP) ---- */
function markEN(ok, w){
  var e=enState();
  w=w||(EN.cur&&EN.cur.w);
  if(!w) return 0;
  var id=w.id, before=e.box[id]||0;
  if(ok){
    e.right[id]=(e.right[id]||0)+1;
    e.streak=(e.streak||0)+1;
    e.box[id]=Math.min(5,before+1);
    var ri=(e.review||[]).indexOf(id); if(ri>=0) e.review.splice(ri,1);
  }else{
    e.wrong[id]=(e.wrong[id]||0)+1;
    e.streak=0;
    e.box[id]=0;
    if((e.review||[]).indexOf(id)<0) e.review.push(id);
  }
  e.stats[e.dir].r+=ok?1:0; e.stats[e.dir].w+=ok?0:1;
  var xp=0;
  if(ok && e.box[id]>before){
    var last=e.xpAt[id]||0;
    if(Date.now()-last>600000){ xp=10; e.xpAt[id]=Date.now(); }
  }
  if(ok && e.streak>0 && e.streak%5===0) xp+=5;
  if(xp>0){ gain(xp); EN.sessXp+=xp; }
  if(ok){ EN.sessRight++; try{ dqAdd('ok',1); dqAdd(e.dir==='ev'?'en':'enve',1); }catch(err){} }
  sfx(ok?'ok':'bad');
  checkTopicDone(w.t);
  save(); stats();
  return xp;
}
function checkTopicDone(tid){
  var e=enState();
  if(!tid||e.done[tid]) return;
  var ws=topicWords(tid);
  if(!ws.length) return;
  var learned=ws.filter(function(w){ return (e.box[w.id]||0)>=2; }).length;
  if(learned>=ws.length){
    e.done[tid]=1;
    gain(50); S.v7.gems=(S.v7.gems||0)+3; save();
    pop('Hoàn thành chủ đề '+(topicOf(tid)||{vi:tid}).vi+'! +50 XP, +3 💎',1);
  }
}
function topicProgress(tid){
  var e=enState(), ws=topicWords(tid);
  var learned=ws.filter(function(w){ return (e.box[w.id]||0)>=2; }).length;
  var r=0, wr=0;
  ws.forEach(function(w){ r+=(e.right[w.id]||0); wr+=(e.wrong[w.id]||0); });
  return {total:ws.length, learned:learned, right:r, wrong:wr, done:!!e.done[tid]};
}

function speakEN(t){
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);
    u.lang='en-US'; u.rate=.85;
    speechSynthesis.speak(u);
  }catch(err){}
}

  var h='<div class="encard s"><div class="enword">Nghe</div><div class="mute">Nghe và chọn '+(e.dir==='ev'?'nghĩa tiếng Việt đúng':'cách viết đúng')+'</div>'
    +'<div class="acts"><button class="btn pri" onclick="__v14.speak(\''+w.id+'\')">'+enIcon('listen.png')+' Nghe lại</button></div></div>';
  h+='<div class="opts">'+EN.cur.opts.map(function(o,i){
    var cl='';
    if(EN.answered!==null) cl=(o.id===w.id?'right':(o.id===EN.answered?'wrong':''));
    return '<button class="opt '+cl+'" onclick="__v14.pick(\''+o.id+'\')">'+(i+1)+'. '+esc14(o[field])+'</button>';
  }).join('')+'</div>';
  if(EN.answered!==null){
    h+='<div class="msg" style="color:var(--'+(EN.ok?'ok':'bad')+')">'+(EN.ok?'Chính xác! +'+(EN.lastXp||0)+' XP':'Chưa đúng. Đáp án: '+esc14(w[field]))+'</div>'+detailsHTML(w)+nextBtn();
  }
  return h;
}
function raceHTML(){
  var r=EN.race;
  if(!r) return '<p class="mute">Đang chuẩn bị…</p>';
  if(r.over){
    return '<div class="encard s"><div class="enword">'+r.score+' câu đúng</div><div class="mute">Bạn trả lời đúng '+r.score+' câu trong 60 giây · +'+r.xp+' XP</div></div>'
      +'<div class="acts"><button class="btn pri" onclick="__v14.raceAgain()">Chơi lại</button></div>';
  }
  var w=r.q?r.q.w:null;
  var h='<div class="enracebar"><span id="enrace-t">'+r.left+'s</span><span>Đúng '+r.score+'</span></div>';
  if(w){
    var e=enState(), field=e.dir==='ev'?'vi':'en';
    h+='<div class="encard s"><div class="enword">'+esc14(e.dir==='ev'?w.en:w.vi)+'</div></div>';
    h+='<div class="opts">'+r.q.opts.map(function(o,i){
      var cl='';
      if(r.answered!==null) cl=(o.id===w.id?'right':(o.id===r.answered?'wrong':''));
      return '<button class="opt '+cl+'" onclick="__v14.racePick(\''+o.id+'\')">'+(i+1)+'. '+esc14(o[field])+'</button>';
    }).join('')+'</div>';
  }
  return h;
}

/* ---- flashcard ---- */
function fcList(){
  if(!EN.fcList||!EN.fcList.length) EN.fcList=poolWords();
  if(!EN.fcList.length) EN.fcList=allWords();
  return EN.fcList;
}
function fcHTML(){
  var list=fcList();
  if(!list.length) return '<p class="mute">Không có từ nào.</p>';
  if(EN.fcIdx>=list.length) EN.fcIdx=0;
  var w=list[EN.fcIdx], e=enState();
  var front=e.dir==='ev'?w.en:w.vi, back=e.dir==='ev'?w.vi:w.en;
  var h='<div class="enfcwrap"><div class="enfc '+(EN.fcFlip?'fl':'')+'" onclick="__v14.fcFlip()" role="button" tabindex="0" aria-label="Lật thẻ">'
    +'<div class="enfc-in"><div class="enfc-f"><div class="enword">'+esc14(front)+'</div><div class="mute">Bấm để lật thẻ</div></div>'
    +'<div class="enfc-b"><div class="enword">'+esc14(back)+'</div>'+detailsHTML(w)+'</div></div></div>';
  h+='<div class="acts"><button class="btn sm" onclick="__v14.fcPrev()">← Trước</button><button class="btn sm" onclick="__v14.fcNext()">Sau →</button><button class="btn sm" onclick="__v14.fcShuffle()">Trộn</button><button class="btn sm" onclick="__v14.speak(\''+w.id+'\')">'+enIcon('listen.png')+' Nghe</button></div>';
  if(EN.fcFlip) h+='<div class="acts"><button class="btn bad" onclick="__v14.fcRate(false)">Chưa nhớ</button><button class="btn ok" onclick="__v14.fcRate(true)">Đã nhớ</button></div>';
  h+='<p class="mute">Thẻ '+(EN.fcIdx+1)+' trên '+list.length+(e.topic?' · '+(topicOf(e.topic)||{vi:e.topic}).vi:'')+'</p></div>';
  return h;
}
/* ---- review / topics / vocab ---- */
function reviewHTML(){
  var e=enState();
  var rows=allWords().filter(function(w){ return (e.wrong[w.id]||0)>0; })
    .sort(function(a,b){ return (e.wrong[b.id]||0)-(e.wrong[a.id]||0); });
  var h='<div class="enhead2"><b>'+rows.length+' từ cần ôn</b><span class="mute">Sắp xếp theo số lần sai — từ hay quên nhất lên trước.</span></div>';
  if(!rows.length) return h+'<p class="mute">Chưa có từ nào sai. Trả lời sai một câu, từ đó sẽ xuất hiện ở đây để ôn lại.</p>';
  h+='<div class="acts"><button class="btn pri" onclick="__v14.reviewStart()">Ôn tất cả từ sai</button></div>';
  h+='<div class="enrows">'+rows.map(function(w){
    return '<div class="enrow"><div><b>'+esc14(w.en)+'</b> <span class="mute">'+esc14(w.ipa)+'</span><br><span>'+esc14(w.vi)+'</span></div>'
      +'<div class="enrowst">Sai '+(e.wrong[w.id]||0)+' · Đúng '+(e.right[w.id]||0)+' · hộp '+(e.box[w.id]||0)+'/5</div>'
      +'<button class="btn sm" onclick="__v14.reviewOne(\''+w.id+'\')">Ôn</button></div>';
  }).join('')+'</div>';
  return h;
}
function topicsHTML(){
  var h='<div class="entopics">'+TOPICS.map(function(t){
    var p=topicProgress(t.id), pct=p.total?Math.round(p.learned/p.total*100):0;
    return '<div class="entopic"><div class="entopic-ic">'+enIcon(t.icon)+'</div><div class="entopic-n"><b>'+t.name+'</b><br><span class="mute">'+t.vi+'</span></div>'
      +'<div class="enbar"><i style="width:'+pct+'%"></i></div><div class="mute">'+p.learned+'/'+p.total+' đã thuộc · Đúng '+p.right+' · Sai '+p.wrong+(p.done?' · Hoàn thành':'')+'</div>'
      +'<div class="acts"><button class="btn sm pri" onclick="__v14.topicGo(\''+t.id+'\',\'choice\')">Học</button><button class="btn sm" onclick="__v14.topicGo(\''+t.id+'\',\'card\')">Flashcard</button></div></div>';
  }).join('')+'</div>';
  return h;
}
function vocabRows(){
  var e=enState(), q=(EN.vq||'').toLowerCase();
  var list=allWords().filter(function(w){ return !q || (w.en+' '+w.vi+' '+w.t).toLowerCase().indexOf(q)>=0; });
  return list.slice(0,120).map(function(w){
    return '<div class="enrow"><div><b>'+esc14(w.en)+'</b> <span class="mute">'+esc14(w.ipa)+' · '+(POS[w.pos]||w.pos)+'</span><br><span>'+esc14(w.vi)+'</span> <span class="mute">· '+esc14((topicOf(w.t)||{vi:w.t}).vi)+'</span></div>'
      +'<div class="enrowst">hộp '+(e.box[w.id]||0)+'/5</div>'
      +(w.custom?'<button class="btn sm bad" onclick="__v14.delCustom(\''+w.id+'\')">Xóa</button>':'')
      +'<button class="btn sm" onclick="__v14.speak(\''+w.id+'\')">'+enIcon('listen.png')+'</button></div>';
  }).join('')||'<p class="mute">Không tìm thấy từ nào.</p>';
}
function vocabHTML(){
  var e=enState();
  var h='<div class="enhead2"><b>'+allWords().length+' từ tiếng Anh</b><span class="mute">'+ENWORDS.length+' từ có sẵn · '+e.custom.length+' từ bạn thêm</span></div>';
  h+='<input type="text" class="srch" placeholder="Tìm từ tiếng Anh, nghĩa, chủ đề" value="'+esc14(EN.vq||'')+'" oninput="__v14.vq(this.value)">';
  h+='<div class="enrows" id="enrows">'+vocabRows()+'</div>';
  h+='<h3>Thêm từ mới</h3><div class="enadd">'
    +'<input id="en-a-en" placeholder="Từ tiếng Anh *"><input id="en-a-vi" placeholder="Nghĩa tiếng Việt *">'
    +'<input id="en-a-ipa" placeholder="Phiên âm IPA, vd /dɔːɡ/"><select id="en-a-pos"><option value="n">danh từ</option><option value="v">động từ</option><option value="adj">tính từ</option></select>'
    +'<select id="en-a-t">'+TOPICS.map(function(t){ return '<option value="'+t.id+'">'+t.name+' – '+t.vi+'</option>'; }).join('')+'</select>'
    +'<input id="en-a-ex" placeholder="Câu ví dụ tiếng Anh"><input id="en-a-exvi" placeholder="Dịch câu ví dụ">'
    +'<button class="btn pri" onclick="__v14.addCustom()">Thêm từ</button></div>';
  h+='<h3>Nhập / Xuất danh sách từ</h3><p class="mute">Nhập: dán JSON (mảng các từ) hoặc mỗi dòng một từ theo dạng <b>en | vi | ipa | pos | ex | exvi</b>. Xuất: tải toàn bộ danh sách (kể cả từ bạn thêm) về file JSON.</p>'
    +'<textarea id="en-io" rows="4" placeholder="Dán danh sách từ vào đây…"></textarea>'
    +'<div class="acts"><button class="btn pri" onclick="__v14.importWords()">Nhập từ</button><button class="btn sm" onclick="__v14.exportWords()">Xuất JSON</button><button class="btn sm" onclick="__v14.copyWords()">Sao chép JSON</button></div>';
  return h;
}
/* ---- race ---- */
function startRace(){
  if(EN.race&&EN.race.iv) clearInterval(EN.race.iv);
  EN.race={left:60, score:0, q:null, answered:null, over:false, xp:0, iv:null};
  raceNext();
  EN.race.iv=setInterval(function(){
    if(!EN.race||EN.race.over) return;
    EN.race.left--;
    var t=document.getElementById('enrace-t');
    if(t) t.textContent=EN.race.left+'s';
    if(EN.race.left<=0) endRace();
  },1000);
}
function raceNext(){
  var w=pickWord();
  var e=enState(), field=e.dir==='ev'?'vi':'en';
  EN.race.q={w:w, opts:shuffle14([w].concat(distractors(w,3,field)))};
  EN.race.answered=null;
}
function raceMark(ok,w){
  var e=enState(), id=w.id;
  if(ok){ e.right[id]=(e.right[id]||0)+1; e.box[id]=Math.min(5,(e.box[id]||0)+1); var ri=(e.review||[]).indexOf(id); if(ri>=0) e.review.splice(ri,1); }
  else { e.wrong[id]=(e.wrong[id]||0)+1; e.box[id]=0; if((e.review||[]).indexOf(id)<0) e.review.push(id); }
  e.stats[e.dir].r+=ok?1:0; e.stats[e.dir].w+=ok?0:1;
  checkTopicDone(w.t);
  save();
}
function endRace(){
  var r=EN.race; if(!r) return;
  clearInterval(r.iv); r.over=true;
  r.xp=Math.min(r.score*2,30);
  if(r.xp>0){ gain(r.xp); EN.sessXp+=r.xp; }
  try{ dqAdd('race',r.score,1); dqAdd('ok',r.score); }catch(err){}
  save(); stats(); stage();
}
/* ---- actions ---- */
function next(){ EN.scUsed={}; EN.scBuilt=''; setupQuestion(); stage(); }
function pick(id){
  if(!EN.cur||EN.answered!==null) return;
  EN.answered=id;
  var w=EN.cur.w;
  EN.ok=(id===w.id);
  EN.lastXp=markEN(EN.ok,w);
  stage();
}
function submitType(){
  if(!EN.cur||EN.answered!==null) return;
  var inp=document.getElementById('en-in'); if(!inp) return;
  var v=inp.value.trim(); if(!v) return;
  var w=EN.cur.w, e=enState(), ok;
  if(e.dir==='ev') ok=w.vi.split(',').map(norm).indexOf(norm(v))>=0;
  else ok=norm(v)===norm(w.en);
  EN.answered=v; EN.ok=ok; EN.lastXp=markEN(ok,w); stage();
}
function hintType(){
  var w=EN.cur&&EN.cur.w; if(!w) return;
  var inp=document.getElementById('en-in'); if(!inp) return;
  inp.value=w.en.slice(0,1); inp.focus();
}
function mClick(side,id){
  if(!EN.cur||!EN.cur.match) return;
  if(EN.mPairs[id]==='ok') return;
  if(!EN.mSel){ EN.mSel={side:side,id:id}; stage(); return; }
  if(EN.mSel.side===side){ EN.mSel={side:side,id:id}; stage(); return; }
  var a=EN.mSel, b={side:side,id:id};
  var enId=a.side==='en'?a.id:b.id, viId=a.side==='vi'?a.id:b.id;
  if(enId===viId){
    EN.mPairs[enId]='ok'; EN.mDone++;
    markEN(true,wordById(enId));
  }else{
    EN.mWrong={a:a.id,b:b.id};
    setTimeout(function(){ EN.mWrong=null; stage(); },700);
  }
  EN.mSel=null; stage();
}
function scClick(i){
  if(!EN.cur||EN.answered!==null) return;
  EN.scUsed=EN.scUsed||{};
  if(EN.scUsed[i]) return;
  EN.scUsed[i]=1;
  EN.scBuilt=(EN.scBuilt||'')+EN.cur.tiles[i];
  stage();
}
function scClear(){ EN.scBuilt=''; EN.scUsed={}; stage(); }
function scHint(){
  if(!EN.cur||EN.answered!==null) return;
  var first=EN.cur.w.en[0].toLowerCase();
  for(var i=0;i<EN.cur.tiles.length;i++){
    if(!((EN.scUsed||{})[i])&&EN.cur.tiles[i]===first){ EN.scUsed[i]=1; EN.scBuilt=(EN.scBuilt||'')+first; break; }
  }
  stage();
}
function scCheck(){
  if(!EN.cur||EN.answered!==null) return;
  var w=EN.cur.w;
  EN.answered=EN.scBuilt||'—';
  EN.ok=norm(EN.scBuilt)===norm(w.en);
  EN.lastXp=markEN(EN.ok,w);
  stage();
}
function racePick(id){
  var r=EN.race; if(!r||r.over||r.answered!==null) return;
  r.answered=id;
  var w=r.q.w, ok=(id===w.id);
  raceMark(ok,w);
  if(ok) r.score++;
  sfx(ok?'ok':'bad');
  stage();
  setTimeout(function(){ if(EN.race&&!EN.race.over){ raceNext(); stage(); } },650);
}
function fcFlip(){ EN.fcFlip=!EN.fcFlip; stage(); }
function fcNext(){ var l=fcList(); EN.fcIdx=(EN.fcIdx+1)%l.length; EN.fcFlip=false; stage(); }
function fcPrev(){ var l=fcList(); EN.fcIdx=(EN.fcIdx-1+l.length)%l.length; EN.fcFlip=false; stage(); }
function fcShuffle(){ EN.fcList=shuffle14(poolWords()); EN.fcIdx=0; EN.fcFlip=false; stage(); }
function fcRate(ok){ var l=fcList(), w=l[EN.fcIdx]; if(!w) return; markEN(ok,w); EN.fcIdx=(EN.fcIdx+1)%l.length; EN.fcFlip=false; stage(); }
function reviewStart(){ EN.reviewMode=true; enState().ex='choice'; setupQuestion(); stage(); }
function reviewOne(id){ EN.reviewMode=true; EN.forceId=id; enState().ex='choice'; setupQuestion(); stage(); }
function reviewOff(){ EN.reviewMode=false; setupQuestion(); stage(); }
function setDir(d){ var e=enState(); e.dir=d; save(); setupQuestion(); stage(); }
function setEx(k){
  var e=enState();
  if(EN.race&&EN.race.iv){ clearInterval(EN.race.iv); EN.race=null; }
  e.ex=k; EN.fcList=null; EN.fcIdx=0; EN.fcFlip=false;
  setupQuestion(); save(); stage();
}
function setTopic(tid){ var e=enState(); e.topic=tid; EN.fcList=null; EN.fcIdx=0; EN.fcFlip=false; setupQuestion(); save(); stage(); }
function topicGo(tid,ex){ var e=enState(); e.topic=tid; e.ex=ex; EN.fcList=null; EN.fcIdx=0; EN.fcFlip=false; setupQuestion(); save(); stage(); }
function setVq(v){ EN.vq=v; var el=document.getElementById('enrows'); if(el) el.innerHTML=vocabRows(); }
function uid14(){ return 'u'+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36); }
function addCustom(){
  var g=function(id){ var el=document.getElementById(id); return el?el.value.trim():''; };
  var en=g('en-a-en'), vi=g('en-a-vi');
  if(!en||!vi){ pop('Nhập từ tiếng Anh và nghĩa tiếng Việt.'); return; }
  var e=enState();
  e.custom.push({t:g('en-a-t')||'daily',en:en,vi:vi,ipa:g('en-a-ipa'),pos:g('en-a-pos')||'n',ex:g('en-a-ex'),exvi:g('en-a-exvi'),uid:uid14()});
  save(); stage(); pop('Đã thêm từ "'+en+'".');
}
function delCustom(id){
  var e=enState();
  e.custom=e.custom.filter(function(w){ return (w.uid||'')!==id; });
  save(); stage();
}
function importWords(){
  var ta=document.getElementById('en-io'); if(!ta) return;
  var txt=ta.value.trim(); if(!txt){ pop('Dán danh sách từ vào ô trước.'); return; }
  var e=enState(), added=0;
  var topic=document.getElementById('en-a-t')?document.getElementById('en-a-t').value:'daily';
  var parsed=false;
  try{
    var arr=JSON.parse(txt);
    if(Array.isArray(arr)){
      parsed=true;
      arr.forEach(function(o){
        if(o&&o.en&&o.vi){ e.custom.push({t:o.t||o.topic||topic,en:String(o.en),vi:String(o.vi),ipa:o.ipa||'',pos:o.pos||'n',ex:o.ex||'',exvi:o.exvi||'',uid:uid14()}); added++; }
      });
    }
  }catch(err){ parsed=false; }
  if(!parsed){
    txt.split('\n').forEach(function(line){
      var p=line.split('|').map(function(s){ return s.trim(); });
      if(p[0]&&p[1]){ e.custom.push({t:topic,en:p[0],vi:p[1],ipa:p[2]||'',pos:p[3]||'n',ex:p[4]||'',exvi:p[5]||'',uid:uid14()}); added++; }
    });
  }
  if(added){ save(); stage(); pop('Đã nhập '+added+' từ.'); }
  else pop('Không nhập được từ nào. Kiểm tra định dạng.');
}
function exportWords(){
  var data=JSON.stringify(allWords().map(function(w){ return {t:w.t,en:w.en,vi:w.vi,ipa:w.ipa,pos:w.pos,ex:w.ex,exvi:w.exvi}; }),null,2);
  var blob=new Blob([data],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='english-words.json'; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
}
function copyWords(){
  var data=JSON.stringify(allWords().map(function(w){ return {t:w.t,en:w.en,vi:w.vi,ipa:w.ipa,pos:w.pos,ex:w.ex,exvi:w.exvi}; }));
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(data).then(function(){ pop('Đã sao chép danh sách từ.'); },function(){ pop('Không sao chép được.'); }); }
  else { var ta=document.getElementById('en-io'); if(ta){ ta.value=data; ta.select(); } }
}
function speak(id){ var w=wordById(id); if(w) speakEN(w.en); }
/* ---- wiring ---- */
var ogStage=window.stage;
window.stage=function(){
  if(S.opt.mode==='en'){ renderEN(); return; }
  if(EN.race&&EN.race.iv){ clearInterval(EN.race.iv); EN.race=null; }
  return ogStage();
};
addEventListener('keydown',function(e){
  if(S.opt.mode!=='en'||view!=='study') return;
  var t=e.target;
  if(['INPUT','TEXTAREA','SELECT'].includes(t.tagName)) return;
  var ex=enState().ex;
  if(ex==='card'&&(e.key===' '||e.key==='Enter')){ e.preventDefault(); fcFlip(); }
  else if((ex==='choice'||ex==='listen'||ex==='fill')&&EN.answered!==null&&(e.key==='Enter'||e.key===' ')){ e.preventDefault(); next(); }
  else if((ex==='choice'||ex==='listen'||ex==='fill')&&/^[1-4]$/.test(e.key)&&EN.cur&&EN.cur.opts&&EN.cur.opts[+e.key-1]){ pick(EN.cur.opts[+e.key-1].id); }
});
window.__v14={dir:setDir, ex:setEx, topic:setTopic, topicGo:topicGo, next:next, pick:pick, submitType:submitType, hintType:hintType,
  mClick:mClick, scClick:scClick, scClear:scClear, scHint:scHint, scCheck:scCheck, racePick:racePick, raceAgain:startRace,
  fcFlip:fcFlip, fcNext:fcNext, fcPrev:fcPrev, fcShuffle:fcShuffle, fcRate:fcRate,
  reviewStart:reviewStart, reviewOne:reviewOne, reviewOff:reviewOff,
  vq:setVq, addCustom:addCustom, delCustom:delCustom, importWords:importWords, exportWords:exportWords, copyWords:copyWords,
  speak:speak, ENWORDS:ENWORDS, TOPICS:TOPICS, get state(){ return enState(); },
  get curW(){ return EN.cur?EN.cur.w:null; }, get sess(){ return {right:EN.sessRight,xp:EN.sessXp}; }, get race(){ return EN.race; }};
})();

</script>
